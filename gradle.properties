# ==========================================
# DARK PROJECT - OPTIMIZED FOR MOBILE BUILD
# ==========================================

# 1. Memory limit ko kam kiya taaki phone crash na ho
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m

# 2. Heavy background processes (Daemon) ko band kiya
org.gradle.daemon=false

# 3. Multi-tasking band ki taaki processor par load na pade
org.gradle.parallel=false
org.gradle.workers.max=1

# 4. Kotlin Compiler ko alag se naya process banane se roka (CRITICAL FIX)
kotlin.compiler.execution.strategy=in-process

# 5. Project ki default AndroidX settings
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true